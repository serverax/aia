name: AIA Dev Build Images

# Builds and pushes the AIA service images to:
#   ghcr.io/serverax/<service>:<tag>
# Versioned tags only (no :latest). Trigger by pushing a v* tag, or run
# manually via workflow_dispatch with an explicit tag (e.g. v0.1.0).
#
# AUTH: GITHUB_TOKEN was DENIED pushing to ghcr.io/serverax/* ("token does not
# match expected scopes" — observed in run 26503671827), so a PAT is required:
#   set repo secrets GHCR_USERNAME=serverax and
#   GHCR_TOKEN=<classic PAT with write:packages>.
# The login step falls back to GITHUB_TOKEN when those are unset (which fails).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to build & push (e.g. v0.1.0)"
        required: true
        default: v0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: serverax

jobs:
  build:
    name: build ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: orchestrator_agent, image: orchestrator-agent }
          - { dir: echo_agent,         image: echo-agent }
          - { dir: analyst_agent,      image: analyst-agent }
          - { dir: compliance_agent,   image: compliance-agent }
          - { dir: compliance-service, image: compliance-service }
          - { dir: editor_agent,       image: editor-agent }
          - { dir: realtime_collab,    image: realtime-collab }
          - { dir: rag_system,         image: rag-system }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.image }}:${{ steps.meta.outputs.tag }}
        uses: docker/build-push-action@v6
        with:
          # Context is the repo ROOT: the Dockerfiles COPY libs/ and the root
          # requirements.txt, so the build context cannot be the service dir.
          context: .
          file: services/${{ matrix.dir }}/Dockerfile
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
