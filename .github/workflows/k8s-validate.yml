name: k8s manifest dry-run

# Client-side schema/parse validation for the manifests in k8s/.
# Catches gross schema errors and YAML breakage before any cluster
# apply. Does NOT prove deployability — it does not contact a cluster,
# does not check that CRDs are installed, and does not validate that
# the placeholder web image is reachable from the cluster's network.
#
# k8s/ on this branch is intentionally bootstrap-only (see k8s/README.md).
# The real production deploy surface lives in helm/ and is gated
# separately.

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  dry-run:
    name: kubectl apply --dry-run=client -f k8s/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: kubectl client version
        run: kubectl version --client=true

      - name: Install kubeconform
        # Offline schema validator. kubectl v1.31+ `--dry-run=client` still
        # tries to fetch OpenAPI from a cluster, which fails on hosted
        # runners; kubeconform bundles its own schemas, so we get real
        # field-level validation without a cluster.
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: List k8s/ YAML
        run: |
          find k8s -type f \( -name '*.yaml' -o -name '*.yml' \) -print

      - name: kubectl client-side dry-run (parse + kind decode)
        # --validate=false skips the OpenAPI-from-cluster fetch; YAML parse
        # and apiVersion/kind/metadata decoding still happen here.
        run: |
          kubectl apply --dry-run=client --validate=false --recursive -f k8s/

      - name: kubeconform field-level schema validation
        # Real schema validation against bundled Kubernetes schemas.
        # -strict treats undefined fields as errors. -summary prints counts.
        run: |
          kubeconform -strict -summary -verbose k8s/
