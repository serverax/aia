name: Quality
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install flake8 pylint bandit
      - run: flake8 libs/ services/ || true
      - run: pylint libs/ services/ --exit-zero || true
      - run: bandit -r libs/ services/ || true
