name: Security + API focused tests

# Runs the three test files this branch's QA pass identified as the
# production-auth / kill-switch / Hiring-API regression target. Uses a
# minimal pinned dependency subset so this gate stays independent of the
# full AI stack (langchain / wasmtime / qdrant / pymilvus) in
# requirements.txt.
#
# Targets:
#   - tests/unit/test_auth_prod_guard.py
#       libs/auth.assert_auth_safe_for_production() — prod env + dev
#       userdb/secret raises (R-2 source of truth).
#   - tests/compliance/test_killswitch_auth.py
#       PUT /compliance/kill-switch is admin-only; GET + /evaluate stay open.
#   - apps/api/tests/  (includes test_prod_guard_wired.py)
#       Hiring API auth, CRUD flow, scoring, health, and the lifespan-level
#       wiring of the production guard.
#   - tests/security/test_pre_deploy_check.py
#       Sprint 9 pre-deploy security gate: capability validator, generator
#       drift, policy-runtime sub-tests, manifest dry-run, RBAC audit. Runs
#       scripts/security/pre_deploy_check.sh via subprocess. On a Linux CI
#       runner with no cluster, manifest_dry_run and rbac_audit self-SKIP
#       at WARN/INFO severity; verdict stays GO if no critical findings.
#
# Why a separate workflow:
#   - ci.yml's unit-test job filters on -m unit and only walks
#     tests/unit + selected services/*/tests, so two of the three
#     targets above (compliance + apps/api) are silently skipped.
#   - This gate is meant to be the floor — green here = the production
#     guard, kill-switch auth, and Hiring API auth are all proved on
#     Python 3.11 / Linux.

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  security-api:
    name: pytest auth-guard + kill-switch + Hiring API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install minimal dependency subset
        # Pinned to match the relevant slices of requirements.txt /
        # requirements-dev.txt. Intentionally avoids the full AI dep
        # stack — those are gated by ci.yml's unit-test/integration-test
        # jobs instead. pyyaml is added for the pre-deploy gate sub-scripts
        # (scripts/security/capability_validator.py, generate_policies.py).
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "fastapi==0.115.0" \
            "pydantic==2.9.2" \
            "pydantic-settings==2.5.2" \
            "passlib[bcrypt]==1.7.4" \
            "python-jose[cryptography]==3.3.0" \
            "email-validator==2.2.0" \
            "python-multipart==0.0.20" \
            "asyncpg==0.29.0" \
            "httpx==0.27.2" \
            "pyyaml==6.0.2" \
            "pytest==8.3.3" \
            "pytest-asyncio==0.24.0"

      - name: Show environment
        run: |
          python --version
          python -m pytest --version

      - name: Run focused security + API tests
        run: |
          python -m pytest -q \
            tests/unit/test_auth_prod_guard.py \
            tests/compliance/test_killswitch_auth.py \
            apps/api/tests

      - name: Run pre-deploy security checks
        # Sprint 9 pre-deploy gate (tests/security/test_pre_deploy_check.py).
        # Drives scripts/security/pre_deploy_check.sh via subprocess. On the
        # hosted runner with no kubeconfig, the manifest_dry_run sub-check
        # self-skips at WARN severity and the rbac_audit sub-check self-skips
        # at INFO severity — both non-blocking. The clean-repo GO verdict
        # test asserts rc=0 against critical=0.
        run: |
          python -m pytest -q tests/security/test_pre_deploy_check.py
