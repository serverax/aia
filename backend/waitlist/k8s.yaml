apiVersion: v1
kind: Namespace
metadata:
  name: aia-waitlist
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waitlist-api
  namespace: aia-waitlist
spec:
  replicas: 2
  selector:
    matchLabels:
      app: waitlist-api
  template:
    metadata:
      labels:
        app: waitlist-api
    spec:
      containers:
      - name: api
        image: aia-waitlist:latest
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: waitlist-api
  namespace: aia-waitlist
spec:
  type: ClusterIP
  selector:
    app: waitlist-api
  ports:
  - port: 5000
    targetPort: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: waitlist-ingress
  namespace: aia-waitlist
spec:
  ingressClassName: nginx
  rules:
  - host: api.aia.ordinoxai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: waitlist-api
            port:
              number: 5000
