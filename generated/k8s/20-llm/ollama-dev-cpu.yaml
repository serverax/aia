apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-dev-models
  namespace: aia-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 40Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aia-ollama-dev-cpu
  namespace: aia-dev
  labels:
    app: aia-ollama-dev-cpu
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aia-ollama-dev-cpu
  template:
    metadata:
      labels:
        app: aia-ollama-dev-cpu
        environment: dev
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.6.8
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: OLLAMA_KEEP_ALIVE
              value: "5m"
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "8"
              memory: "16Gi"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-dev-models
---
apiVersion: v1
kind: Service
metadata:
  name: aia-ollama-dev-cpu
  namespace: aia-dev
spec:
  selector:
    app: aia-ollama-dev-cpu
  ports:
    - name: http
      port: 11434
      targetPort: 11434
