apiVersion: batch/v1
kind: CronJob
metadata:
  name: aia-supabase-dev-backup
  namespace: aia-dev
spec:
  schedule: "15 2 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  echo "DEV backup placeholder."
                  echo "Set DATABASE_URL and S3 upload command before enabling."
                  exit 0
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
