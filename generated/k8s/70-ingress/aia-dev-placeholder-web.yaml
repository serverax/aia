apiVersion: v1
kind: ConfigMap
metadata:
  name: aia-dev-placeholder-html
  namespace: aia-dev
data:
  index.html: |
    <!doctype html>
    <html>
      <head>
        <title>AIA DEV</title>
        <meta charset="utf-8" />
      </head>
      <body style="font-family: Arial, sans-serif; padding: 40px;">
        <h1>AIA Hiring Webapp DEV</h1>
        <p>Status: running</p>
        <p>Domain: dev.ordinoxai.com</p>
        <p>Protected production domain: ordinoxai.com</p>
        <p>This is a dev placeholder and does not modify production DNS.</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aia-dev-web
  namespace: aia-dev
  labels:
    app: aia-dev-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aia-dev-web
  template:
    metadata:
      labels:
        app: aia-dev-web
        environment: dev
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: html
          configMap:
            name: aia-dev-placeholder-html
---
apiVersion: v1
kind: Service
metadata:
  name: aia-dev-web
  namespace: aia-dev
spec:
  selector:
    app: aia-dev-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
