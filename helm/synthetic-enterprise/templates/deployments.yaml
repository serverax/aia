{{- $g := .Values.global -}}
{{- $d := .Values.defaults -}}
{{- $release := .Release.Name -}}
{{- $managedBy := .Release.Service -}}
{{- range $name, $svc := .Values.services }}
{{- $port := $svc.port | default $d.port -}}
{{- $replicas := $svc.replicas | default $d.replicas -}}
{{- $healthPath := $svc.healthPath | default $d.healthPath -}}
{{- $readyPath := $svc.readyPath | default $d.readyPath -}}
{{- $resources := $svc.resources | default $d.resources -}}
{{- $mc := $svc.modelCache | default dict -}}
{{- $hasModelCache := $mc.enabled | default false -}}
{{- $ctx := dict "name" $name "release" $release "managedBy" $managedBy }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $release }}-{{ $name }}
  namespace: {{ $g.namespace }}
  labels:
    {{- include "se.labels" $ctx | nindent 4 }}
# Agents talk to Redis/Postgres, not the K8s API — deny token automount.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $release }}-{{ $name }}
  namespace: {{ $g.namespace }}
  labels:
    {{- include "se.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      {{- include "se.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "se.selectorLabels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ $release }}-{{ $name }}
      automountServiceAccountToken: false
      {{- with $g.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: "{{ $g.imageRegistry }}/{{ $svc.image }}:{{ $g.imageTag }}"
          imagePullPolicy: {{ $g.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $port }}
          envFrom:
            - configMapRef:
                name: {{ $release }}-config
          {{- if or $g.externalSecret $hasModelCache }}
          env:
            {{- if $hasModelCache }}
            - name: HF_HOME
              value: "{{ $mc.path }}/hf"
            - name: TRANSFORMERS_CACHE
              value: "{{ $mc.path }}/hf"
            - name: SENTENCE_TRANSFORMERS_HOME
              value: "{{ $mc.path }}/st"
            {{- end }}
            {{- if $g.externalSecret }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $g.externalSecret }}
                  key: postgres-password
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $g.externalSecret }}
                  key: anthropic-api-key
                  optional: {{ not $.Values.anthropicRequired }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $g.externalSecret }}
                  key: redis-password
                  optional: true
            {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: {{ $healthPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ $readyPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $hasModelCache }}
            - name: model-cache
              mountPath: {{ $mc.path }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $hasModelCache }}
        - name: model-cache
          emptyDir:
            {{- if $mc.sizeLimit }}
            sizeLimit: {{ $mc.sizeLimit }}
            {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $release }}-{{ $name }}
  namespace: {{ $g.namespace }}
  labels:
    {{- include "se.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "se.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
{{- end }}
