apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-service
  namespace: ordinox-ai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: compliance-service
      version: v1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: compliance-service
        version: v1
    spec:
      containers:
      - name: compliance-service
        image: ghcr.io/serverax/compliance-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
