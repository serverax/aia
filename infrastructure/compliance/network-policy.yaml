apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: compliance-service-ingress
  namespace: ordinox-ai
spec:
  podSelector:
    matchLabels:
      app: compliance-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ordinox-ai
      ports:
        - protocol: TCP
          port: 8000
