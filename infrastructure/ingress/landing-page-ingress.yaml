apiVersion: v1
kind: Namespace
metadata:
  name: landing-page
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: landing-page-html
  namespace: landing-page
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AiA - AI Manufacturing Intelligence</title>
        <style>
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #16213e 100%);
                color: #e0e0e0;
                min-height: 100vh;
            }
            nav {
                position: fixed;
                top: 0;
                width: 100%;
                padding: 20px 50px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                background: rgba(15, 15, 30, 0.95);
                border-bottom: 1px solid rgba(100, 200, 255, 0.2);
                z-index: 1000;
            }
            .logo {
                font-size: 28px;
                font-weight: bold;
                color: #64c8ff;
            }
            nav a {
                color: #a0a0a0;
                text-decoration: none;
                margin: 0 30px;
            }
            nav a:hover { color: #64c8ff; }
            .hero {
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 100px 50px 50px;
            }
            .hero-content { flex: 1; }
            .hero h1 {
                font-size: 72px;
                line-height: 1.2;
                margin-bottom: 20px;
                color: #64c8ff;
            }
            .hero h1 span { display: block; font-size: 48px; margin-top: 10px; }
            .hero p {
                font-size: 20px;
                color: #a0a0a0;
                margin: 20px 0 40px;
                line-height: 1.6;
                max-width: 600px;
            }
            .cta-buttons {
                display: flex;
                gap: 20px;
                margin: 40px 0;
            }
            .btn {
                padding: 15px 40px;
                border: none;
                border-radius: 50px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s;
            }
            .btn-primary {
                background: linear-gradient(135deg, #64c8ff 0%, #00ffff 100%);
                color: #0f0f1e;
            }
            .btn-primary:hover {
                transform: translateY(-3px);
            }
            .btn-secondary {
                border: 2px solid #64c8ff;
                color: #64c8ff;
                background: transparent;
            }
            .hero-visual {
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .factory-container {
                width: 400px;
                height: 400px;
                position: relative;
            }
            .machine {
                position: absolute;
                width: 100px;
                height: 100px;
                background: linear-gradient(135deg, #64c8ff 0%, #0099ff 100%);
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 50px;
            }
            .machine-1 { top: 50px; left: 50px; animation: float1 4s ease-in-out infinite; }
            .machine-2 { top: 50px; right: 50px; animation: float2 5s ease-in-out infinite; }
            .machine-3 { bottom: 50px; left: 50px; animation: float3 4.5s ease-in-out infinite; }
            .machine-4 { bottom: 50px; right: 50px; animation: float4 5.5s ease-in-out infinite; }
            @keyframes float1 {
                0%, 100% { transform: translateY(0px); }
                50% { transform: translateY(-30px); }
            }
            @keyframes float2 {
                0%, 100% { transform: translateY(0px); }
                50% { transform: translateY(-40px); }
            }
            @keyframes float3 {
                0%, 100% { transform: translateY(0px); }
                50% { transform: translateY(-35px); }
            }
            @keyframes float4 {
                0%, 100% { transform: translateY(0px); }
                50% { transform: translateY(-45px); }
            }
            .center-orb {
                position: absolute;
                width: 120px;
                height: 120px;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: radial-gradient(circle at 30% 30%, #64c8ff, #0099ff);
                border-radius: 50%;
                animation: pulse 3s ease-in-out infinite;
            }
            @keyframes pulse {
                0%, 100% { transform: translate(-50%, -50%) scale(1); }
                50% { transform: translate(-50%, -50%) scale(1.1); }
            }
            .ring {
                position: absolute;
                width: 280px;
                height: 280px;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                border: 2px solid rgba(100, 200, 255, 0.3);
                border-radius: 50%;
                animation: rotate 20s linear infinite;
            }
            @keyframes rotate {
                from { transform: translate(-50%, -50%) rotateZ(0deg); }
                to { transform: translate(-50%, -50%) rotateZ(360deg); }
            }
            .stats {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 30px;
                margin-top: 80px;
                padding: 40px;
                background: rgba(100, 200, 255, 0.05);
                border-radius: 15px;
            }
            .stat { text-align: center; }
            .stat-number { font-size: 36px; font-weight: bold; color: #64c8ff; }
            .stat-label { color: #a0a0a0; font-size: 14px; }
            .features {
                padding: 100px 50px;
            }
            .features h2 {
                text-align: center;
                font-size: 48px;
                margin-bottom: 60px;
                color: #64c8ff;
            }
            .features-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 30px;
            }
            .feature-card {
                padding: 30px;
                background: rgba(100, 200, 255, 0.05);
                border: 1px solid rgba(100, 200, 255, 0.2);
                border-radius: 15px;
            }
            .feature-card:hover {
                transform: translateY(-10px);
            }
            .feature-icon { font-size: 40px; margin-bottom: 15px; }
            .feature-card h3 { color: #64c8ff; margin-bottom: 10px; }
            .feature-card p { color: #a0a0a0; }
            footer {
                padding: 30px 50px;
                text-align: center;
                color: #666;
                border-top: 1px solid rgba(100, 200, 255, 0.2);
            }
            @media (max-width: 768px) {
                .hero { flex-direction: column; }
                .hero h1 { font-size: 48px; }
                .stats, .features-grid { grid-template-columns: 1fr; }
            }
        </style>
    </head>
    <body>
        <nav>
            <div class="logo">AiA</div>
            <div>
                <a href="#features">Features</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </div>
        </nav>

        <section class="hero">
            <div class="hero-content">
                <h1>
                    AI Manufacturing
                    <span>Intelligence Platform</span>
                </h1>
                <p>Intelligent automation for modern manufacturing. Real-time monitoring, predictive analytics, and autonomous decision-making for industrial operations at scale.</p>
                <div class="cta-buttons">
                    <button class="btn btn-primary">Get Started</button>
                    <button class="btn btn-secondary">Learn More</button>
                </div>
                <div class="stats">
                    <div class="stat">
                        <div class="stat-number">99.9%</div>
                        <div class="stat-label">Uptime SLA</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number">1000+</div>
                        <div class="stat-label">Metrics/sec</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number">50ms</div>
                        <div class="stat-label">Alert Latency</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number">100%</div>
                        <div class="stat-label">Kubernetes Native</div>
                    </div>
                </div>
            </div>

            <div class="hero-visual">
                <div class="factory-container">
                    <div class="ring"></div>
                    <div class="center-orb"></div>
                    <div class="machine machine-1">⚙️</div>
                    <div class="machine machine-2">🤖</div>
                    <div class="machine machine-3">🔧</div>
                    <div class="machine machine-4">📊</div>
                </div>
            </div>
        </section>

        <section class="features" id="features">
            <h2>Intelligent Manufacturing Platform</h2>
            <div class="features-grid">
                <div class="feature-card">
                    <div class="feature-icon">📊</div>
                    <h3>Real-Time Monitoring</h3>
                    <p>Live dashboards with 1000+ metrics per second.</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">🔮</div>
                    <h3>Predictive Analytics</h3>
                    <p>AI-powered forecasting identifies issues before they occur.</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">🚀</div>
                    <h3>Autonomous Control</h3>
                    <p>Self-healing systems with zero-downtime updates.</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">☁️</div>
                    <h3>Cloud Native</h3>
                    <p>100% Kubernetes-native architecture.</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">🔐</div>
                    <h3>Enterprise Security</h3>
                    <p>Multi-layer security with HTTPS, RBAC, network policies.</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">📈</div>
                    <h3>Scalable Infrastructure</h3>
                    <p>Horizontal scaling from 100 to 10,000 ops per second.</p>
                </div>
            </div>
        </section>

        <footer id="contact">
            <p>&copy; 2026 AiA - AI Manufacturing Intelligence. All rights reserved.</p>
            <p>Kubernetes | Prometheus | Grafana | Cloud Native | Open Source</p>
        </footer>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing-page
  namespace: landing-page
spec:
  replicas: 2
  selector:
    matchLabels:
      app: landing-page
  template:
    metadata:
      labels:
        app: landing-page
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: cache
          mountPath: /var/cache/nginx
        - name: run
          mountPath: /var/run
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: html
        configMap:
          name: landing-page-html
      - name: tmp
        emptyDir: {}
      - name: cache
        emptyDir: {}
      - name: run
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: landing-page-svc
  namespace: landing-page
spec:
  type: ClusterIP
  selector:
    app: landing-page
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: landing-page-ingress
  namespace: landing-page
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - aia.ordinoxai.com
    secretName: landing-page-tls
  rules:
  - host: aia.ordinoxai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: landing-page-svc
            port:
              number: 80
