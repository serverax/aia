# Template only — do NOT commit a real key. Replace the value, apply once,
# then add this file to a SealedSecret in Sprint 8.
#
#   kubectl create secret generic llm-api-keys \
#       -n synthetic-enterprise \
#       --from-literal=ANTHROPIC_API_KEY=sk-ant-XXXX
#
# (the manifest below is equivalent — left here for reference)

apiVersion: v1
kind: Secret
metadata:
  name: llm-api-keys
  namespace: synthetic-enterprise
type: Opaque
stringData:
  ANTHROPIC_API_KEY: REPLACE_ME_BEFORE_APPLY
