apiVersion: v1
kind: Namespace
metadata:
  name: ordinox-ai
  labels:
    name: ordinox-ai
    app: ordinox-ai
    environment: production
---
# Generic agent ServiceAccount. Sprint 1/2/7 manifests reference this name.
# Sprint 6 Day 8 introduces per-agent ServiceAccounts (echo-agent-sa,
# orchestrator-agent-sa, etc.) but `agent-sa` stays for compatibility.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sa
  namespace: ordinox-ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-role
  namespace: ordinox-ai
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-rolebinding
  namespace: ordinox-ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-role
subjects:
- kind: ServiceAccount
  name: agent-sa
  namespace: ordinox-ai
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ordinox-ai-quota
  namespace: ordinox-ai
spec:
  hard:
    requests.cpu: "200"
    requests.memory: "400Gi"
    limits.cpu: "400"
    limits.memory: "800Gi"
    pods: "1000"
    services: "200"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: ordinox-ai
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal
  namespace: ordinox-ai
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ordinox-ai
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: ordinox-ai
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          name: databases
    ports:
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
