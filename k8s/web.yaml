apiVersion: v1
kind: ConfigMap
metadata:
  name: ordinoxai-web-html
  namespace: ordinoxai-prod
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>OrdinoxAI</title>
      <style>
        body {
          margin: 0;
          font-family: Arial, sans-serif;
          background: #050816;
          color: #f8fafc;
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
        }
        main {
          max-width: 760px;
          padding: 40px;
          border: 1px solid #1e293b;
          border-radius: 20px;
          background: #0f172a;
        }
        h1 { font-size: 42px; margin-bottom: 12px; }
        p { font-size: 18px; line-height: 1.6; color: #cbd5e1; }
        .pill {
          display: inline-block;
          margin-top: 20px;
          padding: 10px 14px;
          border-radius: 999px;
          background: #1e293b;
          color: #93c5fd;
        }
      </style>
    </head>
    <body>
      <main>
        <h1>OrdinoxAI</h1>
        <p>AI agent hiring and management platform.</p>
        <p>The Kubernetes namespace is ready. Web app, database, AI services, and secure access are being connected.</p>
        <span class="pill">Status: bootstrap online</span>
      </main>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordinoxai-web
  namespace: ordinoxai-prod
  labels:
    app: ordinoxai-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ordinoxai-web
  template:
    metadata:
      labels:
        app: ordinoxai-web
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: html
          configMap:
            name: ordinoxai-web-html
---
apiVersion: v1
kind: Service
metadata:
  name: ordinoxai-web
  namespace: ordinoxai-prod
spec:
  type: ClusterIP
  selector:
    app: ordinoxai-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
