apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing-page
  namespace: synthetic-enterprise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing-page
  template:
    metadata:
      labels:
        app: landing-page
    spec:
      containers:
      - name: landing-page
        image: nginx
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: landing-page
  namespace: synthetic-enterprise
spec:
  selector:
    app: landing-page
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: landing-page
  namespace: synthetic-enterprise
spec:
  ingressClassName: nginx
  rules:
  - host: aia.ordinoxai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: landing-page
            port:
              number: 80
