apiVersion: v1
kind: ConfigMap
metadata:
  name: landing-page-config
  namespace: default
data:
  index.html: |
    (File content will be mounted separately)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing-page
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: landing-page
  template:
    metadata:
      labels:
        app: landing-page
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        configMap:
          name: landing-page-config
---
apiVersion: v1
kind: Service
metadata:
  name: landing-page
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: landing-page
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: landing-page-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - host: aia.ordinoxai.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: landing-page
            port:
              number: 80
