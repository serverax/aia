[package]
name = "aia_tool_sdk"
version = "0.1.0"
edition = "2021"
description = "Shared helpers for AIA WASM tools: JSON stdin/stdout, error helpers, main macro."
license = "Proprietary"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
